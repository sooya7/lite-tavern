# 轻酒馆 lite-tavern：外网 https://117.72.216.74:8446/ → 127.0.0.1:8730（按用户要求不设访问密码）
# 证书与 Luker 共用 Let's Encrypt IP 证书，由 luker-ip-cert-renew.timer 续期并重载 nginx
server {
    listen 8446 ssl http2;
    listen [::]:8446 ssl http2;
    server_name _;
    ssl_certificate /opt/luker/acme/config/live/luker-ip/fullchain.pem;
    ssl_certificate_key /opt/luker/acme/config/live/luker-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;

    # 生成接口是流式的：不缓冲、不压缩，长连接
    location ^~ /api/llm/ {
        proxy_pass http://127.0.0.1:8730;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8730;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
