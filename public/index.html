<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#faf9f5">
<title>轻酒馆</title>
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="轻酒馆">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
// 先按上次的主题上色，免得深色用户刷新时白屏闪一下（真正的设置在 settings.json，启动后会再应用一次）
try {
    const t = localStorage.getItem('lt-theme') || 'auto';
    document.documentElement.dataset.theme = t === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
} catch { /* 无痕模式等拿不到 localStorage */ }
</script>
<link rel="stylesheet" href="css/app.css?v=20261010h27">
<script src="vendor/lodash.min.js"></script>
<script src="vendor/showdown.min.js"></script>
<script src="vendor/purify.min.js"></script>
</head>
<body>
<div id="app" class="app">
    <aside id="left" class="drawer drawer-left" aria-label="角色与聊天"></aside>
    <main id="center" class="center">
        <header id="topbar" class="topbar"></header>
        <div id="chat-scroll" class="chat-scroll">
            <div id="chat" class="chat"></div>
        </div>
        <footer id="composer" class="composer"></footer>
    </main>
    <aside id="right" class="drawer drawer-right" aria-label="设置面板"></aside>
    <div id="scrim" class="scrim" hidden></div>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="modal-root"></div>
<script type="module" src="js/app.js?v=20261010h27"></script>
</body>
</html>
